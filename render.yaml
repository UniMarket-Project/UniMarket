
services:
  - type: web
    name: unimarket-api
    runtime: docker
    dockerContext: .
    dockerfilePath: apps/api/Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false # Provide your Supabase pooled connection string
      - key: DIRECT_URL
        sync: false # Provide your Supabase direct connection string
      - key: RUN_MIGRATIONS
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 1h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: HMAC_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # Set to your frontend URL: https://unimarket-web-bm0y.onrender.com
      - key: API_URL
        value: https://unimarket-emao.onrender.com
      - key: STORAGE_PROVIDER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: unimarket-media
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_ENDPOINT
        sync: false

  - type: web
    name: unimarket-web
    runtime: docker
    dockerContext: .
    dockerfilePath: apps/web/Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: BACKEND_URL
        sync: false # Set to your Render API URL: https://unimarket-emao.onrender.com
    dockerBuildArgs:
      - key: VITE_API_BASE_URL
        value: /api/v1
      - key: VITE_FRONTEND_URL
        value: https://unimarket-web-bm0y.onrender.com
